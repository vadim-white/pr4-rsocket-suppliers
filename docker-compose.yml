services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine
    container_name: rsocket-suppliers-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
